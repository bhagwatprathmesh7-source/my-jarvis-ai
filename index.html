<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis</title>
    <style>
        body { background-color: #010409; color: #00f0ff; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 90vh; }
        h2 { text-align: center; font-size: 20px; margin-bottom: 10px; }
        #chat-container { flex: 1; border: 1px solid #00f0ff; padding: 10px; border-radius: 8px; overflow-y: auto; background: #0d1117; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .user { background: #161b22; color: #58a6ff; align-self: flex-end; border: 1px solid #30363d; }
        .jarvis { background: #21262d; color: #3fb950; align-self: flex-start; border: 1px solid #30363d; }
        .input-area { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 10px; background: #161b22; border: 1px solid #00f0ff; color: #00f0ff; font-size: 14px; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #00f0ff; color: #010409; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🛡️ Omni Jarvis (Multi-AI Fallback)</h2>
    <div id="chat-container">
        <div class="message jarvis">Jarvis: नमस्कार भावा! मल्टी-एआय फॉलबॅक सिस्टीम सक्रिय आहे. बोल, काय मदत करू?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="काहीतरी विचार..." />
        <button onclick="handleUserQuery()">पाठवा</button>
    </div>

    <script>
        // इथे तुझी मुख्य Gemini API Key टाक
        const GEMINI_API_KEY = "AQ.Ab8RN6I2lIgeUrr7qXOFiEPOY3hvee9SWR_OOz9p7-lxN6SXrw" ; 
        async function handleUserQuery() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage("User", query, "user");
            inputField.value = "";

            const loadingId = appendMessage("Jarvis", "विचार करत आहे...", "jarvis");

            // मल्टी-एआय फॉलबॅक लॉजिक रन करणे
            let response = await getSmartResponseWithFallback(query);
            
            updateMessage(loadingId, response);
        }

        async function getSmartResponseWithFallback(prompt) {
            // प्रयत्न १: मुख्य Gemini AI कडून उत्तर आणणे
            try {
                console.log("Gemini तून उत्तर आणत आहे...");
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                }
            } catch (err) {
                console.warn("Gemini कडून एरर आला, बॅकअप AI कडे जात आहे...", err);
            }

            // प्रयत्न २: बॅकअप AI (उदा. दुसरा फ्री मॉडेल किंवा सेफ फॉलबॅक सर्व्हर)
            try {
                console.log("बॅकअप AI कडून उत्तर आणत आहे...");
                // इथे तू दुसरी मोफत API किंवा अल्टरनेटिव्ह सर्व्हर जोडू शकतोस
                const backupResponse = await callBackupAI(prompt);
                if (backupResponse) return backupResponse;
            } catch (err) {
                console.warn("बॅकअप AI कडूनही रिस्पॉन्स मिळाला नाही...", err);
            }

            // प्रयत्न ३: जर दोन्ही AI बंद किंवा डाऊन असतील, तर Jarvis चा स्वतःचा सेफ मेसेज
            return "भावा, सध्या सर्व्हरवर लोड आहे किंवा नेटवर्क नाही, पण Jarvis कधीच हर मानत नाही! थोड्या वेळाने पुन्हा ट्राय कर.";
        }

        async function callBackupAI(prompt) {
            // भविष्यात इथे दुसरी बॅकअप API जोडता येईल
            return null; 
        }

        function appendMessage(sender, text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function updateMessage(element, text) {
            element.innerHTML = `<strong>Jarvis:</strong> ${text}`;
        }
    </script>
</body>
</html>
