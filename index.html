<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis - 3.7 & Groq Fallback</title>
    <style>
        body { background-color: #010409; color: #00f0ff; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 90vh; }
        h2 { text-align: center; font-size: 18px; margin-bottom: 10px; }
        #chat-container { flex: 1; border: 1px solid #00f0ff; padding: 10px; border-radius: 8px; overflow-y: auto; background: #0d1117; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .user { background: #161b22; color: #58a6ff; align-self: flex-end; border: 1px solid #30363d; }
        .jarvis { background: #21262d; color: #3fb950; align-self: flex-start; border: 1px solid #30363d; }
        .input-area { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 10px; background: #161b22; border: 1px solid #00f0ff; color: #00f0ff; font-size: 14px; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #00f0ff; color: #010409; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🛡️ Omni Jarvis (Gemini 3.7 ➔ Groq)</h2>
    <div id="chat-container">
        <div class="message jarvis">Jarvis: नमस्कार भावा! Gemini 3.7 आणि Groq फॉलबॅक रेडी आहे. बोल, काय हुकूम आहे?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="काहीतरी विचार..." />
        <button onclick="handleUserQuery()">पाठवा</button>
    </div>

    <script>
        // तुझी Gemini API Key
        const GEMINI_API_KEY = "AQ.Ab8RN6I2lIgeUrr7qXOFiEPOY3hvee9SWR_OOz9p7-lxN6SXrw"; 
        // भविष्यात Groq ची की टाकण्यासाठी (सध्या रिकामी ठेवली तरी चालेल)
        const GROQ_API_KEY = ""; 

        async function handleUserQuery() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage("User", query, "user");
            inputField.value = "";

            const loadingId = appendMessage("Jarvis", "विचार करत आहे...", "jarvis");

            let response = await getAdvancedFallbackResponse(query);
            updateMessage(loadingId, response);
        }

        async function getAdvancedFallbackResponse(prompt) {
            // १. प्रयत्न १: Google Gemini (3.7 / लेटेस्ट फ्लॅश मॉडेल)
            try {
                console.log("Gemini 3.7 कडून उत्तर आणत आहे...");
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                }
            } catch (err) {
                console.warn("Gemini कडून एरर आला, Groq कडे शिफ्ट होत आहे...", err);
            }

            // २. प्रयत्न २: Groq API (जर की टाकली असेल तर)
            if (GROQ_API_KEY) {
                try {
                    console.log("Groq AI कडे शिफ्ट झालोय...");
                    const groqRes = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${GROQ_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: "llama3-70b-8192",
                            messages: [{ role: "user", content: prompt }]
                        })
                    });
                    const groqData = await groqRes.json();
                    if (groqData.choices && groqData.choices[0].message.content) {
                        return groqData.choices[0].message.content;
                    }
                } catch (err) {
                    console.warn("Groq कडूनही रिस्पॉन्स मिळाला नाही...", err);
                }
            }

            // ३. प्रयत्न ३: अंतिम सेफ फॉलबॅक
            return "भावा, सर्व्हर डाऊन आहे पण Jarvis अजिबात थांबणार नाही! नेटवर्क तपासून पुन्हा ट्राय कर.";
        }

        function appendMessage(sender, text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function updateMessage(element, text) {
            element.innerHTML = `<strong>Jarvis:</strong> ${text}`;
        }
    </script>
</body>
</html>
