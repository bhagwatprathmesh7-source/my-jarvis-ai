<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis</title>
    <style>
        body { background-color: #010409; color: #00f0ff; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 90vh; }
        h2 { text-align: center; font-size: 20px; margin-bottom: 10px; }
        #chat-container { flex: 1; border: 1px solid #00f0ff; padding: 10px; border-radius: 8px; overflow-y: auto; background: #0d1117; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-wrap: break-word; font-size: 14px; }
        .user { background: #161b22; color: #58a6ff; align-self: flex-end; border: 1px solid #30363d; }
        .jarvis { background: #21262d; color: #3fb950; align-self: flex-start; border: 1px solid #30363d; }
        .input-area { display: flex; gap: 5px; margin-top: 10px; }
        input { flex: 1; padding: 10px; background: #161b22; border: 1px solid #00f0ff; color: #00f0ff; font-size: 14px; border-radius: 5px; outline: none; }
        button { padding: 10px 15px; background: #00f0ff; color: #010409; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>🛡️ Omni Jarvis</h2>
    <div id="chat-container">
        <div class="message jarvis">Jarvis: नमस्कार भावा! मी सज्ज आहे. सांग काय मदत करू?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="काहीतरी विचार..." />
        <button onclick="sendQuery()">पाठवा</button>
    </div>

    <script>
        function sendQuery() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage("User", query, "user");
            inputField.value = "";

            setTimeout(() => {
                appendMessage("Jarvis", "भावा, तुझा मेसेज मिळाला! लवकरच मी पूर्ण AI पॉवरसह अपडेट होतोय.", "jarvis");
            }, 500);
        }

        function appendMessage(sender, text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
