<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis</title>
    <style>
        body { background-color: #010409; color: #00f0ff; font-family: monospace; padding: 20px; }
        #chat-container { max-width: 600px; margin: auto; border: 1px solid #00f0ff; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; background: #0d1117; }
        .message { margin: 10px 0; padding: 8px; border-radius: 5px; }
        .user { background: #161b22; color: #58a6ff; text-align: right; }
        .jarvis { background: #21262d; color: #3fb950; text-align: left; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; background: #161b22; border: 1px solid #00f0ff; color: #00f0ff; font-size: 16px; border-radius: 5px; }
        button { cursor: pointer; background: #00f0ff; color: #010409; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">🛡️ Omni Jarvis AI Core</h2>
    <div id="chat-container">
        <div class="message jarvis">Jarvis: नमस्कार भावा! मी सज्ज आहे. तू मला काहीही विचारू शकतोस.</div>
    </div>

    <input type="text" id="userInput" placeholder="यहाँ कुछ टाइप कर किंवा बोल..." />
    <button onclick="handleUserQuery()">पाठवा (Send)</button>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6IYRAN_GFVOBDwYmfBiSOmDCSAqum_POpiIKJ6XtuzT7w"; // तुमची स्वतःची मुख्य की इथे टाका

        async function handleUserQuery() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage("User", query, "user");
            inputField.value = "";

            const loadingId = appendMessage("Jarvis", "विचार करत आहे...", "jarvis");

            let response = await getSmartResponse(query);
            
            updateMessage(loadingId, response);
        }

        async function getSmartResponse(prompt) {
            // १. पहिला प्रयत्न: Gemini API कडून उत्तर आणणे
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                }
            } catch (err) {
                console.warn("Gemini कडून रिस्पॉन्स मिळाला नाही, बॅकअपकडे जात आहे...", err);
            }

            // २. दुसरा प्रयत्न (Fallback): जर Gemini फेल गेलं तर इथे दुसरी बॅकअप API किंवा सेफ रिस्पॉन्स टाकू शकतो
            return "माफ कर भावा, सध्या मुख्य सर्व्हरवरून डेटा मिळाला नाही, पण Jarvis बॅकअप मोडवर सुरू आहे!";
        }

        function appendMessage(sender, text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function updateMessage(element, text) {
            element.innerHTML = `<strong>Jarvis:</strong> ${text}`;
        }
    </script>
</body>
</html>
