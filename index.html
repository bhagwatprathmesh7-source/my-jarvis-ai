<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI-JARVIS v11.1 STABLE</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-gold: #ffb700;
            --neon-purple: #bd00ff;
            --bg-space: #010409;
            --hud-panel: rgba(4, 11, 24, 0.98);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-space); color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 4px; }
        .hud-container { width: 100%; max-width: 480px; height: 96vh; background: var(--hud-panel); border: 2px solid var(--neon-blue); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--neon-blue); padding-bottom: 6px; color: var(--neon-blue); font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
        .chat-box { flex: 1; overflow-y: auto; background: rgba(0, 0, 0, 0.9); border: 1px solid var(--neon-blue); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; }
        .msg { padding: 6px 8px; border-radius: 6px; word-break: break-word; line-height: 1.3; }
        .sys-msg { color: #8b949e; font-size: 0.6rem; }
        .user-msg { align-self: flex-end; background: rgba(0, 102, 153, 0.6); border: 1px solid var(--neon-blue); color: #fff; max-width: 85%; }
        .ai-msg { align-self: flex-start; border: 1px solid var(--neon-gold); color: var(--neon-gold); background: rgba(255,183,0,0.05); max-width: 88%; white-space: pre-wrap; }
        .input-row { display: flex; gap: 6px; }
        .cmd-input { flex: 1; padding: 8px; background: #000; border: 1px solid var(--neon-blue); border-radius: 6px; color: #fff; font-size: 0.8rem; outline: none; }
        .btn-action { background: var(--neon-blue); color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div class="hud-container">
        <div class="header">
            <span>⚡ OMNI-JARVIS v11.1</span>
            <span style="font-size:0.5rem; color:#00ff66;">● ONLINE</span>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="msg sys-msg">[SYSTEM] Ready, Boss! Type your query below.</div>
        </div>

        <div class="input-row">
            <input type="text" id="userPrompt" class="cmd-input" placeholder="Ask Jarvis anything..." autofocus>
            <button class="btn-action" id="sendBtn">SEND</button>
        </div>
    </div>

    <script>
        const GROQ_KEY = "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";

        function printMsg(sender, text, cls) {
            const box = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "msg " + cls;
            div.innerHTML = "<b>" + sender + ":</b> " + text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text.slice(0, 150));
                window.speechSynthesis.speak(u);
            }
        }

        async function queryAI(prompt) {
            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": "Bearer " + GROQ_KEY 
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are OMNI-JARVIS. Reply directly in Marathi, Hindi or English." }, 
                            { role: "user", content: prompt }
                        ],
                        temperature: 0.7,
                        max_tokens: 400
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    return data?.choices?.[0]?.message?.content || "Executed successfully, Boss!";
                }
            } catch(e) {}
            
            // Fallback response if API fails so message never gets stuck
            return `बॉस, तुमचं म्हणणं मिळालं: "${prompt}". ओम्नी-जार्व्हिस पूर्ण पॉवरमध्ये चालू आहे!`;
        }

        async function runCommand() {
            const input = document.getElementById("userPrompt");
            const text = input.value.trim();
            if (!text) return;
            
            input.value = "";
            printMsg("BOSS", text, "user-msg");
            
            printMsg("SYSTEM", "Processing...", "sys-msg");
            const reply = await queryAI(text);
            
            // Remove system processing message if needed, then print reply
            printMsg("JARVIS", reply, "ai-msg");
            speak(reply);
        }

        // Event Listeners for smooth sending
        document.getElementById("sendBtn").addEventListener("click", runCommand);
        document.getElementById("userPrompt").addEventListener("keypress", function(e) {
            if (e.key === 'Enter') {
                runCommand();
            }
        });
    </script>
</body>
</html>
