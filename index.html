<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis - AI Core</title>
    <style>
        body { background-color: #010409; color: #00f0ff; font-family: monospace; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 90vh; }
        h2 { text-align: center; font-size: 18px; margin-bottom: 10px; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5); }
        #chat-container { flex: 1; border: 1px solid #00f0ff; padding: 12px; border-radius: 8px; overflow-y: auto; background: #0d1117; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 15px rgba(0,240,255,0.1); }
        .message { padding: 10px 14px; border-radius: 6px; max-width: 85%; word-wrap: break-word; font-size: 14px; line-height: 1.4; }
        .user { background: #161b22; color: #58a6ff; align-self: flex-end; border: 1px solid #30363d; }
        .jarvis { background: #21262d; color: #3fb950; align-self: flex-start; border: 1px solid #30363d; }
        .input-area { display: flex; gap: 8px; margin-top: 12px; }
        input { flex: 1; padding: 12px; background: #161b22; border: 1px solid #00f0ff; color: #00f0ff; font-size: 14px; border-radius: 6px; outline: none; }
        input:focus { box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        button { padding: 12px 18px; background: #00f0ff; color: #010409; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #3fb950; color: #fff; }
    </style>
</head>
<body>

    <h2>🛡️ Omni Jarvis AI Core</h2>
    <div id="chat-container">
        <div class="message jarvis">Jarvis: नमस्कार भावा! सिस्टीम पूर्णपणे ऑनलाइन आहे. सांग काय मदत करू?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="काहीतरी विचार किंवा आदेश दे..." onkeypress="handleKeyPress(event)" />
        <button onclick="sendQuery()">पाठवा</button>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6I2lIgeUrr7qXOFiEPOY3hvee9SWR_OOz9p7-lxN6SXrw";

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendQuery();
            }
        }

        async function sendQuery() {
            const inputField = document.getElementById("userInput");
            const query = inputField.value.trim();
            if (!query) return;

            appendMessage("User", query, "user");
            inputField.value = "";

            const loadingId = appendMessage("Jarvis", "विचार करत आहे...", "jarvis");

            let response = await fetchAIResponse(query);
            updateMessage(loadingId, response);
        }

        async function fetchAIResponse(prompt) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                } else if (data.error) {
                    return `अरे भावा, एरर आला: ${data.error.message}`;
                }
            } catch (err) {
                console.error("Network Error:", err);
            }

            return "भावा, सध्या नेटवर्क किंवा सर्व्हरमध्ये थोडा बिघाड आहे, पण Jarvis कधीच हर मानत नाही!";
        }

        function appendMessage(sender, text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function updateMessage(element, text) {
            element.innerHTML = `<strong>Jarvis:</strong> ${text}`;
        }
    </script>
</body>
</html>
