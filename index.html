<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omni Jarvis - Cybernetic System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #050811;
            color: #00f3ff;
            overflow: hidden;
        }
        /* Intro Animation Screen */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020408;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            cursor: pointer;
            transition: opacity 1s ease;
        }
        .particle-sphere {
            width: 220px;
            height: 220px;
            border: 2px dashed #00f3ff;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation: rotateSphere 10s linear infinite;
        }
        .inner-core {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #ff5e00, #00f3ff);
            border-radius: 50%;
            box-shadow: 0 0 25px #ff5e00;
            animation: pulseCore 2s ease-in-out infinite;
        }
        @keyframes rotateSphere {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseCore {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .intro-text {
            margin-top: 25px;
            font-size: 18px;
            letter-spacing: 2px;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.7);
            animation: blinkText 1.5s infinite;
        }
        @keyframes blinkText {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Main App Screen */
        #main-app {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            background: #0b0f19;
        }
        header {
            padding: 15px;
            background: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 16px;
            color: #00f3ff;
            letter-spacing: 1px;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-msg {
            background: #1f2937;
            color: #ffffff;
            align-self: flex-end;
            border-right: 3px solid #00f3ff;
        }
        .jarvis-msg {
            background: #111827;
            color: #00f3ff;
            align-self: flex-start;
            border-left: 3px solid #ff5e00;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.05);
        }
        .input-area {
            padding: 12px;
            background: #111827;
            display: flex;
            gap: 10px;
            border-top: 1px solid #1f2937;
        }
        input {
            flex: 1;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        input:focus {
            border-color: #00f3ff;
        }
        button {
            padding: 0 20px;
            background: #00f3ff;
            color: #050811;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:active {
            background: #00acc1;
        }
    </style>
</head>
<body>

    <!-- Intro Animation Screen -->
    <div id="intro-screen" onclick="startJarvisSystem()">
        <div class="particle-sphere">
            <div class="inner-core"></div>
        </div>
        <div class="intro-text">[ TOUCH TO INITIALIZE JARVIS ]</div>
    </div>

    <!-- Main Jarvis Dashboard & Chat -->
    <div id="main-app">
        <header>
            <h1>⚡ OMNI-JARVIS V11.1 ACTIVE</h1>
            <span style="font-size: 12px; color: #10b981;">● ONLINE</span>
        </header>
        
        <div class="chat-container" id="chatBox">
            <div class="message jarvis-msg">
                [SYSTEM] v11.1 Online. All modules & security simulation protocols loaded, Boss! Tap input below to query.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Jarvis or type command..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Execute</button>
        </div>
    </div>

    <script>
        function startJarvisSystem() {
            const intro = document.getElementById('intro-screen');
            const mainApp = document.getElementById('main-app');
            
            // Fade out intro
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                mainApp.style.display = 'flex';
            }, 1000);
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // Append user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);

            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Simulate Jarvis intelligent response
            setTimeout(() => {
                const jarvisDiv = document.createElement('div');
                jarvisDiv.className = 'message jarvis-msg';
                jarvisDiv.textContent = "Analyzing query regarding '" + text + "'. Executing simulation protocols & defense parameters...";
                chatBox.appendChild(jarvisDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
