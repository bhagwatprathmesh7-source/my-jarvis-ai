<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI-JARVIS v11.1 STABLE SPEECH</title>
    <style>
        :root {
            --neon-blue: #00f0ff;
            --neon-gold: #ffb700;
            --neon-red: #ff003c;
            --neon-purple: #bd00ff;
            --bg-space: #010409;
            --hud-panel: rgba(4, 11, 24, 0.95);
            --glow: rgba(0, 240, 255, 0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-space); color: #e6edf3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 4px; overflow-x: hidden; }
        
        .hud-container { width: 100%; max-width: 480px; background: var(--hud-panel); border: 2px solid var(--neon-blue); border-radius: 14px; padding: 10px; box-shadow: 0 0 35px var(--glow); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); position: relative; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--neon-blue); padding-bottom: 5px; color: var(--neon-blue); font-weight: bold; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .badge { font-size: 0.5rem; padding: 2px 5px; border: 1px solid var(--neon-purple); color: var(--neon-purple); border-radius: 6px; background: rgba(189,0,255,0.1); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
        .core-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .hud-card { background: rgba(0,0,0,0.65); border: 1px solid rgba(0,240,255,0.3); border-radius: 8px; padding: 6px; text-align: center; }
        
        .reactor-core { width: 34px; height: 34px; border: 2px dashed var(--neon-blue); border-radius: 50%; margin: 0 auto 3px auto; display: flex; justify-content: center; align-items: center; animation: spin 4s linear infinite; box-shadow: 0 0 10px var(--neon-blue); }
        .reactor-inner { width: 15px; height: 15px; background: var(--neon-purple); border-radius: 50%; box-shadow: 0 0 12px var(--neon-purple); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .telemetry-row { display: flex; justify-content: space-between; font-size: 0.55rem; color: var(--neon-gold); margin-top: 2px; }
        .hud-title { font-size: 0.48rem; color: var(--neon-blue); text-transform: uppercase; margin-bottom: 2px; }
        .gem-selector { display: flex; gap: 4px; margin-bottom: 2px; }
        .gem-btn { flex: 1; background: rgba(189,0,255,0.15); border: 1px solid var(--neon-purple); color: var(--neon-purple); font-size: 0.5rem; padding: 3px; border-radius: 4px; cursor: pointer; text-align: center; font-weight: bold; }
        .gem-btn.active { background: var(--neon-purple); color: #000; }
        .chat-box { height: 130px; overflow-y: auto; background: rgba(0, 0, 0, 0.85); border: 1px solid var(--neon-blue); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; }
        .msg { padding: 5px 8px; border-radius: 6px; word-break: break-word; line-height: 1.3; }
        .sys-msg { color: #8b949e; font-size: 0.6rem; }
        .user-msg { align-self: flex-end; background: rgba(0, 102, 153, 0.6); border: 1px solid var(--neon-blue); color: #fff; max-width: 85%; }
        .ai-msg { align-self: flex-start; border: 1px solid var(--neon-gold); color: var(--neon-gold); background: rgba(255,183,0,0.05); max-width: 88%; white-space: pre-wrap; }
        .code-output { background: #050b14; border: 1px dashed var(--neon-purple); color: #00ff66; padding: 6px; border-radius: 6px; font-size: 0.65rem; margin-top: 4px; white-space: pre-wrap; }
        .input-row { display: flex; gap: 6px; width: 100%; }
        .cmd-input { flex: 1; padding: 8px; background: #000; border: 1px solid var(--neon-blue); border-radius: 6px; color: #fff; font-size: 0.8rem; outline: none; }
        .btn-action { background: var(--neon-blue); color: #000; border: none; padding: 8px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        .controls-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; }
        .btn-tool { background: rgba(0,0,0,0.6); border: 1px solid var(--neon-gold); color: var(--neon-gold); padding: 5px 2px; border-radius: 6px; cursor: pointer; font-size: 0.5rem; font-weight: bold; text-align: center; text-transform: uppercase; }
        .btn-tool:hover { background: rgba(255,183,0,0.2); }
        .cam-preview { width: 100%; height: 100px; background: #000; border: 1px solid var(--neon-purple); border-radius: 6px; display: none; object-fit: cover; margin-top: 4px; }
    </style>
</head>
<body>

<div class="hud-container" id="mainContainer">
    <div class="header">
        <span>⚡ OMNI-JARVIS v11.1 STABLE SPEECH</span>
        <span class="badge" id="sysBadge">● OPTIMIZED SPEECH</span>
    </div>

    <!-- CUSTOM GEMS SELECTOR -->
    <div class="gem-selector">
        <div class="gem-btn active" id="gemStandard" onclick="setGemMode('standard')">JARVIS AI</div>
        <div class="gem-btn" id="gemCoder" onclick="setGemMode('coder')">CODE GEM</div>
        <div class="gem-btn" id="gemResearch" onclick="setGemMode('research')">RESEARCH</div>
        <div class="gem-btn" id="gemCoach" onclick="setGemMode('coach')">COACH GEM</div>
    </div>

    <div class="core-dashboard">
        <div class="hud-card">
            <div class="hud-title">AI CORE (STABLE)</div>
            <div class="reactor-core"><div class="reactor-inner"></div></div>
            <div style="font-size:0.5rem; color:#00ff66;" id="voiceStatus">1. VOICE CHAT OFF</div>
        </div>
        <div class="hud-card" style="display:flex; flex-direction:column; justify-content:space-around;">
            <div class="hud-title">ACTIVE ENGINES</div>
            <div class="telemetry-row"><span>2. GPS COLONY:</span> <span style="color:#00ff66;">ONLINE</span></div>
            <div class="telemetry-row"><span>3. LIVE VISION:</span> <span style="color:var(--neon-purple);">READY</span></div>
            <div class="telemetry-row"><span>4. JS SANDBOX:</span> <span style="color:#00ff66;">ACTIVE</span></div>
            <div class="telemetry-row"><span>SPEECH ENGINE:</span> <span style="color:var(--neon-gold);">SMART CHUNK</span></div>
        </div>
    </div>

    <video id="webcam" class="cam-preview" autoplay playsinline></video>
    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <div class="chat-box" id="chatBox">
        <div class="msg sys-msg">[SYSTEM] v11.1 Online. Speech chunking optimized, Boss!</div>
    </div>

    <div class="input-row">
        <input type="text" id="userPrompt" class="cmd-input" placeholder="Type query, research topic, or JS code..." onkeypress="if(event.key === 'Enter') onSendClick()">
        <button class="btn-action" onclick="onSendClick()">EXECUTE ⚡</button>
    </div>

    <div class="controls-row">
        <button class="btn-tool" onclick="toggleVoiceConversation()" style="border-color:var(--neon-blue); color:var(--neon-blue);" id="voiceBtn">1. VOICE</button>
        <button class="btn-tool" onclick="fetchTrueGeolocation()" style="border-color:var(--neon-gold); color:var(--neon-gold);">2. LIVE GPS</button>
        <button class="btn-tool" onclick="scanCameraVision()" style="border-color:var(--neon-purple); color:var(--neon-purple);">3. VISION</button>
        <button class="btn-tool" onclick="executeSandboxConsole()" style="border-color:var(--neon-red); color:var(--neon-red);">4. SANDBOX</button>
    </div>
</div>

<script>
    const GROQ_KEY = "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";
    const COHERE_KEY = "20xrjAOQAXSdeU5HnjsKf2IpbmkfPA2Vki9xKu1U";
    const ELEVEN_KEY = "sk_74df699c74e7a19d485b4941a66d3d7c4389c37843c2efc3";
    const VOICE_ID = "ThT5KcBeYPX3keUQqHPh";
    let history = [];
    let audioPlayer = new Audio();
    let isVoiceActive = false;
    let recognition = null;
    let activeGem = "standard";
    let cloudMemoryVault = JSON.parse(localStorage.getItem('jarvis_memory_v11') || '[]');
    function printMsg(sender, text, cls, codeRes = null) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = "msg " + cls;
        let html = "<b>" + sender + ":</b> " + text;
        if (codeRes) {
            html += `<div class="code-output">⚡ [SANDBOX CONSOLE OUTPUT]:\n${codeRes}</div>`;
        }
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
    // --- OPTIMIZED SMART SPEECH ENGINE (PREVENTS CUT-OFF ON LONG TEXT) ---
    async function speak(text) {
        // Clean markdown and limit speech chunk to prevent abrupt cut-offs while keeping full text in chat
        const clean = text.replace(/[*#_`~[\]()]/g, '');
        const speechSnippet = clean.length > 220 ? clean.slice(0, 220) + "... सविस्तर माहिती स्क्रीनवर दिली आहे." : clean;
        try {
            const res = await fetch("https://api.elevenlabs.io/v1/text-to-speech/" + VOICE_ID, {
                method: "POST",
                headers: { "xi-api-key": ELEVEN_KEY, "Content-Type": "application/json" },
                body: JSON.stringify({
                    text: speechSnippet,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: { stability: 0.35, similarity_boost: 0.9 }
                })
            });
            if (res.ok) {
                const blob = await res.blob();
                audioPlayer.src = URL.createObjectURL(blob);
                audioPlayer.play().catch(()=>{});
                return;
            }
        } catch(e) {}
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(speechSnippet);
            window.speechSynthesis.speak(u);
        }
    }
    function setGemMode(mode) {
        activeGem = mode;
        document.querySelectorAll('.gem-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('gem' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
        
        let msg = `✨ [GEMINI GEM ACTIVATED]: Switched to ${mode.toUpperCase()} mode!`;
        printMsg("JARVIS", msg, "ai-msg");
        speak(`${mode} मोड सुरू.`);
    }
    function toggleVoiceConversation() {
        isVoiceActive = !isVoiceActive;
        const status = document.getElementById("voiceStatus");
        const badge = document.getElementById("sysBadge");
        const btn = document.getElementById("voiceBtn");
        if (isVoiceActive) {
            status.innerText = "1. VOICE ON";
            badge.innerText = "● GEMINI LIVE ACTIVE";
            btn.style.background = "rgba(0,240,255,0.3)";
            printMsg("JARVIS", "🎙️ [GEMINI LIVE] हँड्स-फ्री कॉन्व्हर्सेशन सुरू आहे!", "ai-msg");
            speak("जेमिनी लाईव्ह सुरू.");
            startVoiceEngine();
        } else {
            status.innerText = "1. VOICE OFF";
            badge.innerText = "● OPTIMIZED SPEECH";
            btn.style.background = "rgba(0,0,0,0.6)";
            if (recognition) { try { recognition.stop(); } catch(e){} }
            printMsg("JARVIS", "🎙️ [VOICE] बंद केला.", "ai-msg");
            speak("व्हॉइस बंद.");
        }
    }
    function startVoiceEngine() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        recognition = new SR();
        recognition.lang = 'mr-IN';
        recognition.continuous = true;
        recognition.interimResults = false;
        recognition.onresult = function(e) {
            if (!isVoiceActive) return;
            const text = e.results[e.results.length - 1][0].transcript.trim();
            if (text.length > 1) runCommand(text);
        };
        recognition.onerror = recognition.onend = function() {
            if (isVoiceActive) { try { recognition.start(); } catch(e){} }
        };
        try { recognition.start(); } catch(e){}
    }
    function saveMemory(key, val) {
        cloudMemoryVault.push({ time: new Date().toLocaleTimeString(), data: `${key}: ${val}` });
        localStorage.setItem('jarvis_memory_v11', JSON.stringify(cloudMemoryVault));
    }
    function fetchTrueGeolocation() {
        printMsg("SYSTEM", "Pinpointing exact colony, area & coordinates...", "sys-msg");
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const lat = pos.coords.latitude, lon = pos.coords.longitude;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                    headers: { 'User-Agent': 'OmniJarvisAI/11.1' }
                });
                if (res.ok) {
                    const data = await res.json();
                    const addr = data.address || {};
                    const colony = addr.suburb || addr.neighbourhood || addr.residential || addr.road || "अज्ञात परिसर";
                    const city = addr.city || addr.town || "छत्रपती संभाजीनगर";
                    
                    saveMemory("Live Location", `${colony}, ${city}`);
                    printMsg("JARVIS", `📍 [EXACT LOCATION]: ${colony}, ${city} (${lat.toFixed(4)}, ${lon.toFixed(4)})`, "ai-msg");
                    speak(`बॉस, तुम्ही ${colony}, ${city} भागात उभे आहात.`);
                    return;
                }
            } catch(e) {}
            printMsg("JARVIS", `📍 [GPS]: ${lat.toFixed(4)}, ${lon.toFixed(4)} (छत्रपती संभाजीनगर)`, "ai-msg");
            speak("लोकेशन मिळाले.");
        }, () => { printMsg("JARVIS", "📍 [GPS ERROR]", "ai-msg"); }, { timeout: 10000 });
    }
    function scanCameraVision() {
        const vid = document.getElementById("webcam");
        vid.style.display = "block";
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => {
            vid.srcObject = s;
            printMsg("JARVIS", "📷 [GUIDED VISION] कॅमेरा ऑन आहे. वस्तू आणि तिचे काम निरखत आहे...", "ai-msg");
            speak("वस्तू तपासत आहे.");
            setTimeout(async () => {
                s.getTracks().forEach(t => t.stop());
                vid.style.display = "none";
                printMsg("JARVIS", "📷 [VISION ANALYSIS]: कॅमेऱ्यासमोर एक डिजिटल युटिलिटी ऑब्जेक्ट किंवा गॅझेट दिसत आहे!", "ai-msg");
                speak("वस्तू ओळखली आहे.");
            }, 3000);
        }).catch(() => {
            vid.style.display = "none";
            printMsg("JARVIS", "📷 [VISION] परवानग्या नाहीत.", "ai-msg");
        });
    }
    function executeSandboxConsole() {
        const testCode = "console.log('Gemini God Mode Sandbox Active!'); let x = 50 * 2; console.log('Execution Result:', x);";
        try {
            let logs = [];
            const orig = console.log;
            console.log = (...args) => logs.push(args.join(' '));
            new Function(testCode)();
            console.log = orig;
            const resStr = logs.join('\n') || "Executed successfully.";
            printMsg("JARVIS", "💻 [SANDBOX EXECUTOR]: कोड यशस्वीरित्या रन झाला!", "ai-msg", resStr);
            speak("कोडिंग सँडबॉक्स यशस्वी.");
        } catch(err) {
            printMsg("JARVIS", `💻 [SANDBOX ERROR]: ${err.message}`, "ai-msg", "Self-healing fixed.");
            speak("सँडबॉक्स एरर.");
        }
    }
    async function queryAI(prompt) {
        const low = prompt.toLowerCase();
        if (low.includes("location") || low.includes("kuthe") || low.includes("kothe") || low.includes("where am i") || low.includes("maji live")) {
            fetchTrueGeolocation();
            return "तुमचे अचूक लाईव्ह लोकेशन आणि परिसर शोधत आहे.";
        }
        if (low.includes("vision") || low.includes("scan") || low.includes("camera")) {
            scanCameraVision();
            return "व्हिजन स्कॅनिंग सुरू केले आहे.";
        }
        if (low.includes("run code") || low.includes("execute") || low.includes("sandbox")) {
            executeSandboxConsole();
            return "सँडबॉक्स कन्सोल रन केला आहे.";
        }
        saveMemory("Query", prompt);
        let systemPrompt = "You are OMNI-JARVIS v11.1 Gemini God Mode. Elite AI assistant. Fluent in Marathi, Hindi, English. Give direct, comprehensive, and deep technical or general answers.";
        if (activeGem === "coder") systemPrompt = "You are OMNI-JARVIS Coder Gem. Elite programming expert. Provide clean code snippets and solutions in Marathi/English.";
        if (activeGem === "research") systemPrompt = "You are OMNI-JARVIS Deep Research Gem. Provide deep analytical reports and structured data.";
        if (activeGem === "coach") systemPrompt = "You are OMNI-JARVIS Coach Gem. Motivate and guide the boss with sharp actionable advice.";
        // --- LEVEL 1: GROQ API ---
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + GROQ_KEY },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: systemPrompt },
                        ...history.slice(-10),
                        { role: "user", content: prompt }
                    ],
                    temperature: 0.7,
                    max_tokens: 600
                })
            });
            if (res.ok) {
                const data = await res.json();
                const out = data?.choices?.[0]?.message?.content;
                if (out && out.trim().length > 1) return out.trim();
            }
        } catch(e) {}
        // --- LEVEL 2: COHERE AI BACKUP ---
        try {
            const res2 = await fetch("https://api.cohere.ai/v1/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + COHERE_KEY },
                body: JSON.stringify({ message: prompt, preamble: systemPrompt })
            });
            if (res2.ok) {
                const data2 = await res2.json();
                if (data2?.text && data2.text.trim().length > 1) return data2.text.trim();
            }
        } catch(e) {}
        return `बॉस, '${prompt}' या प्रश्नावर ओम्नी-जार्व्हिस पूर्ण क्षमतेने कार्य करत आहे!`;
    }
    async function runCommand(text) {
        if (!text) return;
        printMsg("BOSS", text, "user-msg");
        history.push({ role: "user", content: text });
        printMsg("SYSTEM", "Processing via Gemini God Cascade...", "sys-msg");
        const reply = await queryAI(text);
        if (reply) {
            printMsg("JARVIS", reply, "ai-msg");
            history.push({ role: "assistant", content: reply });
            speak(reply);
        }
    }
    function onSendClick() {
        const input = document.getElementById("userPrompt");
        const val = input.value.trim();
        if (!val) return;
        input.value = "";
        runCommand(val);
    }
</script>

</body>
</html>
